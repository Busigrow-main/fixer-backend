# /etc/nginx/sites-available/fixxer  — replace example.com with your domain.
# Certbot (--nginx) will add the 443 server block + redirect automatically.

upstream fixxer_web { server 127.0.0.1:3000; keepalive 32; }
upstream fixxer_api { server 127.0.0.1:8081; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 15m;   # API accepts 10 MB JSON + CSV/XLSX uploads

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # NestJS: customer/shop/admin API + Swagger at /api/docs
    location /api/ {
        proxy_pass http://fixxer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # NestJS: technician app routes (/v1/auth/verify-otp etc.)
    location /v1/ {
        proxy_pass http://fixxer_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets — cache hard
    location /_next/static/ {
        proxy_pass http://fixxer_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://fixxer_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
